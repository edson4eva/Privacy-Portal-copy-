server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the sandbox gateway, so never emit the container's own
    # scheme/host/port in a Location header - keep redirects relative.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Each app is a separate SPA mounted under its own prefix, so unknown paths
    # must fall back to that app's index.html rather than the portal index.
    location /complaints/ {
        try_files $uri $uri/ /complaints/index.html;
    }

    location /account-history/ {
        try_files $uri $uri/ /account-history/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Bare prefixes without the trailing slash
    location = /complaints      { return 301 /complaints/; }
    location = /account-history { return 301 /account-history/; }
    location = /admin           { return 301 /admin/; }

    # The portal home is the complaints app's privacy features page, which
    # renders the Privacy Portal landing content inside the account side menu.
    location = / {
        return 302 /complaints/features;
    }

    # Asset filenames carry a content hash and change on every build, so they
    # can be cached hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML entry points are NOT hashed. A stale document would reference
    # asset filenames that no longer exist, which 404 and leave a blank page,
    # so these must always be revalidated.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Anything else is not one of the three apps
    location / {
        return 404;
    }
}

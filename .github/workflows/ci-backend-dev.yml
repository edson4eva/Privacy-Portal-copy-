name: Backend CI/CD Pipeline for DEV

on:
    pull_request:
        branches: [develop]
        paths:
            - 'backend/src/Services/**'
            - 'backend/src/Libs/**'
            - '.github/workflows/ci-backend-dev.yml'
    push:
        branches: [develop]
        paths:
            - 'backend/src/Services/**'
            - 'backend/src/Libs/**'
            - '.github/workflows/ci-backend-dev.yml'
    workflow_dispatch:
        inputs:
            service:
                description: 'Select the service to build and deploy'
                required: true
                default: 'none'
                type: choice
                options:
                    - complaints
                    - services
                    # - eservicesdata
                    # - uiamdata
                    - libs
                    - logingestionservice
jobs:
    detect-changes:
        runs-on: ubuntu-latest
        environment: dev
        outputs:
            complaints_changed: ${{ steps.check_complaints.outputs.changed }}
            accessedServices_changed: ${{ steps.check_accessedServices.outputs.changed }}
            eservicesdata_changed: ${{ steps.check_eservicesdata.outputs.changed }}
            uiamdata_changed: ${{ steps.check_uiamdata.outputs.changed }}
            mockdata_changed: ${{ steps.check_mockdata.outputs.changed }}
            libs_changed: ${{ steps.check_libs.outputs.changed }}
            logingestion_service_changed: ${{ steps.check_logingestion_service.outputs.changed }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Check for Complaints changes
              id: check_complaints
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/Complaints/'; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Check for AccessedServices changes
              id: check_accessedServices
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/AccessedServices/'; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            # - name: Check for EServicesData changes
            #   id: check_eservicesdata
            #   run: |
            #       if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/EServicesData/'; then
            #         echo "changed=true" >> $GITHUB_OUTPUT
            #       else
            #         echo "changed=false" >> $GITHUB_OUTPUT
            #       fi

            # - name: Check for UIAMData changes
            #   id: check_uiamdata
            #   run: |
            #       if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/UIAMData/'; then
            #         echo "changed=true" >> $GITHUB_OUTPUT
            #       else
            #         echo "changed=false" >> $GITHUB_OUTPUT
            #       fi

            # - name: Check for MockData changes
            #   id: check_mockdata
            #   run: |
            #       if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/MockData/'; then
            #         echo "changed=true" >> $GITHUB_OUTPUT
            #       else
            #         echo "changed=false" >> $GITHUB_OUTPUT
            #       fi

            - name: Check for Libs changes
              id: check_libs
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Libs/' | grep -q '.github/workflows/ci-backend-dev.yml'; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Check for Logingestion changes
              id: check_logingestion_service
              run: |
                  if git diff --name-only HEAD^ HEAD | grep -q 'backend/src/Services/LogIngestion'; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi
    unit-test-complaints:
        if: ${{ needs.detect-changes.outputs.complaints_changed == 'true' || needs.detect-changes.outputs.libs_changed == 'true' || github.event.inputs.service == 'complaints' }}
        needs: detect-changes
        uses: ./.github/workflows/_reusable-unit-test.yml
        with:
            unit_test_project_path: 'backend/src/Services/Complaints/tests/UnitTest/UnitTest.csproj'
            environment: dev
        secrets:
            PP_NUGET_PAT: ${{ secrets.PP_NUGET_PAT }}

    build-deploy-complaints:
        if: ${{ needs.unit-test-complaints.outputs.test_status == '0' }}
        needs: unit-test-complaints
        uses: ./.github/workflows/_reusable-build-and-deploy-backend-service.yml
        with:
            service_path: complaints
            dockerfile_path: backend/src/Services/Complaints/src/Complaints.API/Dockerfile
            environment: dev
        secrets:
            AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
            AZURE_CONTAINER_REGISTRY_USERNAME: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
            AZURE_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}
            PP_NUGET_PAT: ${{ secrets.PP_NUGET_PAT }} 

    unit-test-accessed-services:
        if: ${{ needs.detect-changes.outputs.accessedServices_changed == 'true' || needs.detect-changes.outputs.libs_changed == 'true' || github.event.inputs.service == 'services' }}
        needs: detect-changes
        uses: ./.github/workflows/_reusable-unit-test.yml
        with:
            unit_test_project_path: 'backend/src/Services/AccessedServices/tests/UnitTest/UnitTest.csproj'
            environment: dev
        secrets:
            PP_NUGET_PAT: ${{ secrets.PP_NUGET_PAT }}            

    build-deploy-accessedServices:
        if: ${{ needs.unit-test-accessed-services.outputs.test_status == '0' }}
        needs: unit-test-accessed-services
        uses: ./.github/workflows/_reusable-build-and-deploy-backend-service.yml
        with:
            service_path: services
            dockerfile_path: backend/src/Services/AccessedServices/src/AccessedServices.Api/Dockerfile
            environment: dev
        secrets:
            AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
            AZURE_CONTAINER_REGISTRY_USERNAME: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
            AZURE_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}
            PP_NUGET_PAT: ${{ secrets.PP_NUGET_PAT }} 

    # build-deploy-eservicesdata:

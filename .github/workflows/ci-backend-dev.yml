    #         AZURE_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

    build-deploy-logingestionServices:
        if: ${{ needs.detect-changes.outputs.logingestion_service_changed == 'true' || needs.detect-changes.outputs.libs_changed == 'true' || github.event.inputs.service == 'logingestionservice' }}
        needs: detect-changes
        uses: ./.github/workflows/_reusable-build-and-deploy-backend-service.yml
        with:
            service_path: logingestion
            dockerfile_path: backend/src/Services/LogIngestion/src/LogIngestion.Api/Dockerfile
